<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLdUm04wc_WU7KpYenHQdYTVg2lBBBkK1uc8bUENTZbKtYwF2zU9Gt8DTkmONxbOHD/exec"; 

let ANTREAN_DATA = JSON.parse(localStorage.getItem('so_antrean')) || [];
let DATA_P = [], DATA_I = [], DATA_PANTAUAN = [], DATA_STORAGE = [];
let html5QrCode;
let CACHE_MONITORING = null;
let CACHE_HISTORY = null;
let DATA_IS_STALE = true;

window.switchTab = switchTab;
window.onload = async function () {

  lockUI();

  showGlobalLoader("MENYIAPKAN DATA APLIKASI...");

  try {
    await loadSemuaDataAwal();

    const loginUser = getLoginUser();

    if (!loginUser) {
      document.getElementById("loginPage").style.display = "flex";
    } else {
      masukAplikasi(loginUser);
    }

  } catch (e) {
    alert("Gagal memuat data awal.\nCek koneksi internet.");
  } finally {
    hideGlobalLoader();
    unlockUI();
  }
};



let LAST_UPDATE = 0;
let AUTO_REFRESH_TIMER = null;
let DATA_READY = false;

function lockUI() {
  document.querySelectorAll("input, select, button").forEach(el => {
    // 🔓 JANGAN kunci elemen login
    if (
      el.closest("#loginPage") || 
      el.id === "loginNik" || 
      el.id === "loginPass"
    ) {
      return;
    }
    el.disabled = true;
  });
}


function unlockUI() {
  document.querySelectorAll("input, select, button").forEach(el => {
    el.disabled = false;
  });
}

async function muatMonitoringSilent() {
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "getMonitoring",
      tanggal: "ALL"
    })
  }).then(r => r.json());

  CACHE_MONITORING = res;
  renderMonitoringHarian();
}



async function cekUpdateMonitoring() {

  if (!currentTab || currentTab !== "monitoring") return;

  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getLastUpdate" })
    });

    const json = await res.json();
    const serverTime = Number(json.lastUpdate || 0);

    if (serverTime > LAST_UPDATE) {
      console.log("🔄 DATA BARU TERDETEKSI");
      LAST_UPDATE = serverTime;

      // ✅ AMBIL DATA BARU + RENDER
     await muatMonitoringSilent();
    }

  } catch (e) {
    console.warn("Auto refresh gagal:", e);
  }
}



async function refreshDataSilent() {
    try {
        // Mengambil data monitoring & history terbaru tanpa menampilkan Loader (Silent)
        const [resMonitoring, resHistory] = await Promise.all([
            fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "getMonitoring", tanggal: "ALL" }) }).then(r => r.json()),
            fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "getHistoriMatrix" }) }).then(r => r.json())
        ]);

        CACHE_MONITORING = resMonitoring;
        CACHE_HISTORY = resHistory;
        
        // Jika sedang di halaman monitoring, langsung update tampilan
        if (document.getElementById('page-monitoring').classList.contains('active')) {
            renderMonitoringHarian();
            if(document.getElementById('sub-histori').style.display === 'block') renderMatrix();
        }
        console.log("Data monitoring diperbarui otomatis.");
    } catch (err) {
        console.error("Gagal auto-refresh:", err);
    }
}

async function loadDataLoginOnly() {
  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getData" })
    });
    const data = await res.json();
    DATA_P = data.petugas || [];
  } catch (err) {
    alert("❌ Gagal memuat data login");
    console.error(err);
  }
}


async function loadSemuaDataAwal() {
  
  document.querySelector("#loader .loading-text").innerText =
  "MENYIAPKAN DATA SO...";

  try {
    const [resMaster, resMonitoring, resHistory] = await Promise.all([
      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "getData" }) }).then(r => r.json()),
      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "getMonitoring", tanggal: "ALL" }) }).then(r => r.json()),
      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "getHistoriMatrix" }) }).then(r => r.json())
    ]);

    DATA_P = resMaster.petugas;
    DATA_I = resMaster.items;
    DATA_PANTAUAN = resMaster.pantauan;
    DATA_STORAGE = resMaster.storage || [];

    CACHE_MONITORING = resMonitoring;
    CACHE_HISTORY = resHistory;

    DATA_READY = true;

    document.getElementById("loader").style.display = "none";
    unlockUI();

    console.log("✅ DATA SIAP DIGUNAKAN");

  } catch (err) {
    console.error(err);
    alert("❌ Gagal memuat data.\nPeriksa koneksi internet.");
    lockUI();
  }
}
function masukAplikasi(loginUser) {

  console.log("👤 LOGIN USER:", loginUser);

  document.getElementById("loginPage").style.display = "none";
  document.getElementById("btnLogout").style.display = "inline-block";

  unlockUI();

  // isi identitas
  document.getElementById("nik").value = loginUser.nik;
  document.getElementById("nama").value = loginUser.nama;

  const t = new Date();
  document.getElementById("tgl").valueAsDate = t;
  document.getElementById("filterTgl").valueAsDate = t;

  DATA_READY = true;

  console.log("✅ APP READY");
}



function logout() {
  const yakin = confirm("Yakin ingin keluar dari aplikasi?");
  if (!yakin) return;

  // ❌ Hapus session login
  sessionStorage.removeItem("loginUser");

  // 🔒 Kunci UI total
  lockUI();

  // 🔄 Reset field user
  document.getElementById("nik").value = "";
  document.getElementById("nama").value = "-";
  document.getElementById("loginNik").value = "";
  document.getElementById("loginPass").value = "";

  // 🔁 Kembali ke tab INPUT
  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelector('.tab-item:nth-child(1)').classList.add('active');
  document.getElementById('page-so').classList.add('active');

  // ❌ Sembunyikan monitoring
  document.getElementById("page-monitoring").classList.remove("active");

  // ❌ Sembunyikan tombol logout

function getLoginUser() {
  const s = sessionStorage.getItem("loginUser");
  if (s) {
    return JSON.parse(s);
  }

  // FALLBACK (opsional)
  const nikEl = document.getElementById("nik");
  const namaEl = document.getElementById("nama");

  if (nikEl && namaEl) {
    const nik = nikEl.value.trim();
    const nama = namaEl.value.trim();

    if (nik && nama && nama !== "-") {
      return {
        nik: nik,
        nama: nama,
        role: "USER"
      };
    }
  }

  return null;
}

function renderMonitoringHarian() {
    const tglFilter = document.getElementById('filterTgl').value;
    const katFilter = document.getElementById('filterKategori').value;
    if (!CACHE_MONITORING) return;

    // --- LOGIKA AKUMULASI (GROUP BY PLU) ---
    const groupData = {};

    CACHE_MONITORING.forEach(r => {
        const tglData = r[0]; // Tanggal
        const plu = r[4];    // PLU
        const kategoriData = r[17]; // Kategori

        // Filter berdasarkan Tgl dan Kategori dulu
        if (tglData === tglFilter && (katFilter === "ALL" || kategoriData === katFilter)) {
            if (!groupData[plu]) {
                // Jika PLU belum ada di object, buat baru (copy array)
                groupData[plu] = [...r];
                groupData[plu][13] = Number(r[13]) || 0;
                groupData[plu][15] = Number(r[15]) || 0;
            } else {
                groupData[plu][13] = (Number(groupData[plu][13]) || 0) + (Number(r[13]) || 0);
                groupData[plu][15] = (Number(groupData[plu][15]) || 0) + (Number(r[15]) || 0);
                groupData[plu][2] = "REKAP"; 
            }
        }
    });

    // Ubah kembali object groupData menjadi Array untuk di-render
    let filtered = Object.values(groupData);

    // --- LOGIKA HITUNG TOTAL SUMMARY (BOX HITAM) ---
    let totalRp = 0;
    let totalItem = 0;

    filtered.forEach(r => {
        const rp = Number(r[15]) || 0;
        const qtySel = Number(r[13]) || 0;
        if (qtySel !== 0) {
            totalRp += rp;
            totalItem++;
        }
    });

    const formatter = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });
    document.getElementById('totalItemSelisih').innerText = totalItem + " Item";
    document.getElementById('totalNominalSelisih').innerText = formatter.format(totalRp);
    document.getElementById('totalNominalSelisih').style.color = totalRp < 0 ? "#ff4d4d" : "#45f542";

    // --- SORT BY ABSOLUTE RP SELISIH ---
    filtered.sort((a, b) => Math.abs(Number(b[15])) - Math.abs(Number(a[15])));

    let html = "";
    filtered.forEach((r) => {
        const qtySel = Number(r[13]);
        const rpSel = Number(r[15]) || 0;
        const sCol = qtySel < 0 ? "text-danger" : (qtySel > 0 ? "text-success" : "text-muted");
        
        html += `<tr>
            <td class="text-center">${r[4]}</td>
            <td class="col-descp">${r[5]}</td>
            <td class="text-center text-primary fw-bold">${r[6]}</td> <!-- Lokasi -->
            <td class="text-center ${sCol} fw-bold">${r[13]}</td>      <!-- SELISIH -->
            <td class="${sCol} fw-bold">${formatter.format(rpSel)}</td>
            <td class="text-center">
                <button onclick='bukaModalRevisi(${JSON.stringify(r)})'
 class='btn btn-sm btn-outline-warning fw-bold'>REVISI</button>

            </td>
        </tr>`;
    });
    document.getElementById('bodyMonitoring').innerHTML = html || "<tr><td colspan='7' class='text-center'>Data Kosong</td></tr>";
}

function formatTanggalDDMMMYY(value) {
  if (!value) return "";

  const date = new Date(value);
  if (isNaN(date)) return value;

  const bulan = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  const dd = String(date.getDate()).padStart(2, "0");
  const mmm = bulan[date.getMonth()];
  const yy = String(date.getFullYear()).slice(-2);

  return `${dd}-${mmm}-${yy}`;
}

    katFilter === "ALL" || r.kategori === katFilter
  );

  /* ===== SORT TGL TERAKHIR ===== */
  if (sortMode === "last" && res.headers.length) {
    const lastDate = res.headers[res.headers.length - 1];

    rowsFiltered.sort((a, b) => {
      const va = Math.abs(Number(a.vals[lastDate] || 0));
      const vb = Math.abs(Number(b.vals[lastDate] || 0));
      return vb - va;
    });
  }

  /* ===== BUILD EXCEL DATA ===== */
  let aoa = [];

  // HEADER
  let header = ["PLU", "DESCP", "LOKASI", "TAG", ...res.headers];
  aoa.push(header);

  // BODY
  rowsFiltered.forEach(r => {
    let row = [
      r.plu,
      r.descp,
      r.lok,
      r.tag || "-"
    ];

    res.headers.forEach(tgl => {
      if (!(tgl in r.vals)) {
        row.push("X"); // ❌ Tidak SO
      } else {
        row.push(r.vals[tgl]); // ✅ Selisih
      }
    });

    aoa.push(row);
  });

  /* ===== EXPORT ===== */
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "HISTORY_SO");

  XLSX.writeFile(
    wb,
    "HISTORY_SO_" + new Date().toISOString().slice(0,10) + ".xlsx"
  );
}

function showGlobalLoader(text = "MENYIAPKAN DATA...") {
  const loader = document.getElementById("loader");
  loader.style.display = "flex";
  loader.querySelector(".loading-text").innerText = text;
}

function hideGlobalLoader() {
  document.getElementById("loader").style.display = "none";
}



</script>
